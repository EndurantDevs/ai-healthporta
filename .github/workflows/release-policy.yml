name: release-policy-metadata

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited, ready_for_review]

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read
  statuses: write

jobs:
  inspect-release-metadata:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout the main policy event commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Report policy on the exact pull-request head
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_policy.py report-pull-request
