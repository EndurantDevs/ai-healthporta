name: Actions artifact cleanup

"on":
  workflow_run:
    workflows: [release-artifacts]
    types: [completed]
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: actions-artifact-cleanup-${{ github.event.workflow_run.id || github.run_id }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash --noprofile --norc -e -o pipefail {0}

jobs:
  delete-successful-run-artifacts:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Delete artifacts after all consumers finish
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          artifact_ids="$(mktemp)"
          trap 'rm -f "$artifact_ids"' EXIT
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts?per_page=100" \
            --jq '.artifacts[].id' > "$artifact_ids"
          while IFS= read -r artifact_id; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            sleep 1
          done < "$artifact_ids"

  delete-stale-artifacts:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Delete artifacts older than one day
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cutoff="$(date -u -d '1 day ago' '+%Y-%m-%dT%H:%M:%SZ')"
          artifact_ids="$(mktemp)"
          trap 'rm -f "$artifact_ids"' EXIT
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts?per_page=100" |
          jq -r \
            --arg cutoff "${cutoff}" \
            '.artifacts[] |
             select(.expired == false and .created_at < $cutoff) |
             .id' > "$artifact_ids"
          while IFS= read -r artifact_id; do
            gh api --method DELETE \
              "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
            sleep 1
          done < "$artifact_ids"
