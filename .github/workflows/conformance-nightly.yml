name: conformance-nightly

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  conformance:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Strict conformance smoke (informational)
        continue-on-error: true
        run: python3 scripts/conformance_smoke.py --strict

      - name: Lenient conformance smoke (required)
        run: python3 scripts/conformance_smoke.py
