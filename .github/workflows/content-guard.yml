name: content-guard

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  content-guard:
    runs-on: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && vars.AI_HEALTHPORTA_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify public-only content policy
        run: python3 scripts/content_guard.py
