name: release-artifacts

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-release-artifacts:
    permissions:
      contents: write
      actions: read
      checks: read
      pull-requests: read
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify accepted main release before building artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_policy.py publication

      - name: Build distribution bundles
        run: python3 scripts/package_release.py

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: healthporta-mcp-public-artifacts
          path: dist/*
          retention-days: 1

      - name: Publish GitHub release assets
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: dist/*
