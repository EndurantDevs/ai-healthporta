name: validate

on:
  pull_request:
  push:
    branches: [dev, main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  actions: read
  checks: read

jobs:
  validate-artifacts:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AI_HEALTHPORTA_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Verify pull-request routing and release identity
        if: github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/check_release_policy.py pull-request

      - name: Verify CI routing and release contracts
        run: python3 -m unittest discover -s tests -p 'test_*.py'

      - name: Build distribution bundles
        run: python3 scripts/package_release.py

      - name: Validate JSON artifacts and endpoint consistency
        run: python3 scripts/validate_artifacts.py

  conformance-smoke:
    runs-on: ${{ (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main' && vars.AI_HEALTHPORTA_CI_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Run lenient public endpoint smoke checks
        run: python3 scripts/conformance_smoke.py
